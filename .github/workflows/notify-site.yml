name: Notify Codex Chimaera

# When Chimera commits new narrative to mind/, ping the Cloudflare Pages deploy
# hook so codexchimaera.com rebuilds with the latest. Requires the repo secret
# CF_DEPLOY_HOOK; dormant (no-op) until it is set.

on:
  push:
    branches: [main]
    paths:
      - "mind/CHRONICLE.md"
      - "mind/HEARTBEAT.md"
      - "mind/wiki/**"
  workflow_dispatch: {}

concurrency:
  group: notify-codex-chimaera
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::CF_DEPLOY_HOOK is not set; nothing to notify."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null -w "deploy hook -> HTTP %{http_code}\n"
